services:
  # Database Container
  postgres:
    image: postgres:16-alpine
    container_name: enrollnow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enrollnowdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: New_password
    ports:
      - "5432:5432"
    volumes:
      - enrollnow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enrollnowdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["core", "admin", "dashboard", "study", "participant", "recruitment", "survey", "operations", "full", "shell"]

  # 1. Identity Service (Port 8081)
  identity-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.jvm
      args:
        SERVICE_JAR: enrollnow-identity-service/target/enrollnow-identity-service-1.0.0-SNAPSHOT.jar
    container_name: enrollnow-identity-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enrollnowdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: New_password
      JWT_SECRET: enrollnow-enterprise-development-secret-key-must-be-changed-in-production-12345
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["core", "admin", "dashboard", "study", "participant", "recruitment", "survey", "operations", "full", "shell"]

  # 2. Administration Service (Port 8082)
  administration-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.jvm
      args:
        SERVICE_JAR: enrollnow-administration-service/target/enrollnow-administration-service-1.0.0-SNAPSHOT.jar
    container_name: enrollnow-administration-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enrollnowdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: New_password
      JWT_SECRET: enrollnow-enterprise-development-secret-key-must-be-changed-in-production-12345
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["admin", "full"]

  # 3. Organization Service (Port 8083)
