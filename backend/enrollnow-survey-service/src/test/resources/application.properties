spring.application.name=enrollnow-survey-service-test

# H2 In-Memory Database for Unit/Integration Tests
spring.datasource.url=jdbc:h2:mem:surveydb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable Flyway during mock MVC tests with H2 DDL auto
spring.flyway.enabled=false

# Security & JWT
app.jwt.secret=enrollnow-enterprise-development-secret-key-must-be-changed-in-production-12345
app.jwt.expiration-ms=3600000
app.jwt.issuer=enrollnow-identity-service
