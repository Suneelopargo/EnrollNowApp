spring.application.name=enrollnow-communication-service
server.port=8089

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/enrollnowdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:New_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.pool-name=HikariPool-Communication
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# Security & JWT
app.jwt.secret=${JWT_SECRET:enrollnow-enterprise-development-secret-key-must-be-changed-in-production-12345}
app.jwt.expiration-ms=3600000
app.jwt.issuer=enrollnow-identity-service

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# OpenAPI Documentation
app.openapi.title=EnrollNow Communication & Outreach Service API
app.openapi.description=Authoritative Service for Multi-Channel Participant Notifications, SMS, and Email Outreach
app.openapi.version=1.0.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
