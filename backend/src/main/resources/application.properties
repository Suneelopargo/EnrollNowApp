spring.application.name=enrollnow-backend
server.port=8080

# Database Configuration (enrollnowdb)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/enrollnowdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:New_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate (Validate-only per architecture requirement)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security & JWT
app.jwt.secret=${JWT_SECRET:enrollnow-enterprise-development-secret-key-must-be-changed-in-production-12345}
app.jwt.expiration-ms=3600000
app.jwt.issuer=enrollnow-auth-service

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Controlled Bootstrap Administrator
app.bootstrap.admin.enabled=true
app.bootstrap.admin.email=admin@enrollnow.local
app.bootstrap.admin.username=admin
app.bootstrap.admin.password=EnrollNowAdmin2026!
app.bootstrap.admin.first-name=System
app.bootstrap.admin.last-name=Administrator
