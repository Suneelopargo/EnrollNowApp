spring.application.name=enrollnow-app

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/enrollnowdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# PostgreSQL application schema
spring.jpa.properties.hibernate.default_schema=enrollnow

# Flyway schema
spring.flyway.enabled=true
spring.flyway.schemas=enrollnow
spring.flyway.default-schema=enrollnow
spring.flyway.create-schemas=true

# JWT
app.jwt.secret=${JWT_SECRET:enrollnow-enterprise-development-secret-key-must-be-changed-in-production-12345}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.issuer=${JWT_ISSUER:enrollnow-identity-service}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# OpenAPI
app.openapi.title=EnrollNow Platform API
app.openapi.description=Authoritative API Specification for EnrollNow Platform
app.openapi.version=1.0.0

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

